<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utility Network — GIS UI Gallery</title>

<!--
  ================================================================
  UTILITY NETWORK — ArcGIS Maps SDK for JavaScript template
  ================================================================
  Single file. Uses the UtilityNetworkTrace widget on a public webmap.
  Credentials: viewer01 / I68VGU^nMurF  (Esri sample account)

  To go live: swap the webmap ID for your own UN webmap with named
  trace configurations. The widget handles everything else.

  The Prompt that built this:
  "Build a utility network trace app: load a webmap with UN data,
   add the UtilityNetworkTrace widget, show trace types, flags,
   and results panel. ArcGIS JS SDK, single HTML file."
-->

<link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/dark/main.css">
<script src="https://js.arcgis.com/4.31/"></script>

<style>
  :root{
    --bg:#0a0e13; --surface:#11161d; --surface-2:#161d26; --line:rgba(148,196,255,.1);
    --text:#e8f0f8; --text-2:#8fa3b8; --text-3:#4a5568;
    --accent:#38bdf8; --accent-soft:rgba(56,189,248,.14); --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --font-sans:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:var(--font-sans);background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
  #viewDiv{position:absolute;inset:0}

  /* Esri widget skin override — match our dark theme */
  .esri-ui .esri-widget{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px}
  .esri-widget--heading{color:var(--text-2);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
  .esri-widget__heading{color:var(--text-2);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
  .esri-input,.esri-select{background:var(--surface-2)!important;color:var(--text)!important;border:1px solid var(--line)!important}
  .esri-button{background:var(--accent-soft);color:var(--accent);border:1px solid var(--line)}
  .esri-button:hover{background:var(--accent);color:#fff}

  /* loading overlay */
  .loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,14,19,.92);z-index:20;transition:opacity .4s}
  .loading.done{opacity:0;pointer-events:none}
  .loading .ring{width:44px;height:44px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading p{font-family:var(--font-mono);font-size:11px;color:var(--text-2);letter-spacing:.06em}
  .loading .cred{font-family:var(--font-mono);font-size:10px;color:var(--text-3);margin-top:8px;text-align:center}

  /* info strip */
  .info{position:absolute;bottom:20px;left:20px;background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:12px 16px;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:340px}
  .info h3{font-size:12px;font-weight:600;margin-bottom:4px}
  .info p{font-size:11px;color:var(--text-2);line-height:1.45}
  .info .tag{font-family:var(--font-mono);font-size:9px;color:var(--accent);letter-spacing:.06em;margin-bottom:6px;display:block}
</style>
</head>
<body>

<div id="viewDiv"></div>

<div class="loading" id="loading">
  <div>
    <div class="ring"></div>
    <p>Loading utility network…</p>
    <div class="cred">Sign in: viewer01 / I68VGU^nMurF</div>
  </div>
</div>

<div class="info">
  <span class="tag">UTILITY NETWORK · TRACE</span>
  <h3>How to run a trace</h3>
  <p>1. Sign in (viewer01 / I68VGU^nMurF)  2. Pick a trace type from the widget  3. Click the map to set a starting point  4. Click "Run" — the trace result highlights on the map.</p>
</div>

<script type="module">
require([
  "esri/WebMap",
  "esri/views/MapView",
  "esri/widgets/UtilityNetworkTrace",
  "esri/config"
], function(WebMap, MapView, UtilityNetworkTrace, esriConfig){

  esriConfig.portalUrl = "https://www.arcgis.com";

  const webmap = new WebMap({
    portalItem: { id: "471eb0bf37074b1fbb972b1da70fb310" }
  });

  const view = new MapView({
    container: "viewDiv",
    map: webmap
  });

  view.when(() => {
    document.getElementById("loading").classList.add("done");

    const trace = new UtilityNetworkTrace({ view: view });
    view.ui.add(trace, "top-right");
  }).catch(err => {
    console.error(err);
    document.getElementById("loading").classList.add("done");
  });
});
</script>
</body>
</html>
