<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Work Orders (ArcGIS) — GIS UI Gallery</title>

<!--
  ================================================================
  FIELD WORK ORDERS — ArcGIS Maps SDK for JavaScript template
  ================================================================
  Copy this file. To go live:
    1. Point WORKORDER_LAYER_URL at your ArcGIS Feature Service and delete
       the SEED block (it only exists so this demo works without a server).
    2. That's it. List, filters, popup and map all read from the same layer.

  The Prompt that built this:
  "Build a field work-order app: ArcGIS JS SDK map on the right, Calcite
   job list on the left with status filter chips, click a job to zoom and
   open its popup. Show per-status counts. Single HTML file, no build."
-->

<link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/dark/main.css">
<script src="https://js.arcgis.com/4.31/"></script>
<!-- Calcite design system (Esri's UI components) -->
<script type="module" src="https://js.arcgis.com/calcite-components/2.13.2/calcite.esm.js"></script>
<link rel="stylesheet" href="https://js.arcgis.com/calcite-components/2.13.2/calcite.css">

<style>
  :root{
    --accent:#38bdf8; --open:#fbbf24; --progress:#38bdf8; --done:#4ade80; --blocked:#f87171;
    --bg:#0d131c; --panel:#151d29; --line:rgba(148,196,255,.12);
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;font-family:'Avenir Next','Inter',sans-serif;background:var(--bg);color:#e8f0f8}
  #app{display:grid;grid-template-columns:380px 1fr;height:100%}
  #map{height:100%}

  /* ---------- job panel ---------- */
  #panel{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0}
  #panel .head{padding:16px 16px 10px}
  #panel h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
  #panel h1 small{display:block;font-weight:400;font-size:11px;color:#8fa3b8;margin-top:3px;font-family:ui-monospace,monospace;letter-spacing:.05em}
  #filters{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
  .chip{border:1px solid var(--line);background:transparent;color:#8fa3b8;border-radius:99px;
    padding:5px 11px;font-size:11.5px;cursor:pointer;font-family:ui-monospace,monospace;transition:120ms}
  .chip:hover{color:#e8f0f8}
  .chip.on{background:rgba(56,189,248,.14);border-color:var(--accent);color:var(--accent)}
  .chip b{font-weight:600;margin-left:4px}
  #list{flex:1;overflow-y:auto;padding:0 10px 16px;min-height:0}
  calcite-card{margin:0 6px 10px;cursor:pointer;--calcite-card-shadow:0 2px 10px rgba(0,0,0,.25)}
  calcite-card.sel{outline:2px solid var(--accent);outline-offset:-2px}
  .job-top{display:flex;align-items:center;gap:8px;padding:2px 0 6px}
  .job-top .id{font-family:ui-monospace,monospace;font-size:10.5px;color:#8fa3b8}
  .job-top calcite-chip{margin-left:auto}
  .job-title{font-size:13.5px;font-weight:600;line-height:1.3}
  .job-meta{font-size:11px;color:#8fa3b8;margin-top:4px;font-family:ui-monospace,monospace}

  /* popup polish */
  .esri-popup__main-container{border-radius:10px}
  .esri-view .esri-ui-corner .esri-component{box-shadow:0 2px 10px rgba(0,0,0,.35)}

  @media (max-width:760px){
    #app{grid-template-columns:1fr;grid-template-rows:44% 56%}
    #panel{border-right:0;border-top:1px solid var(--line);order:2}
  }
</style>
</head>
<body>

<div id="app">
  <div id="panel">
    <div class="head">
      <h1>Work Orders — Kowloon East<small id="today"></small></h1>
    </div>
    <div id="filters">
      <button class="chip on" data-f="all">all</button>
      <button class="chip" data-f="Open">open<b id="n-Open"></b></button>
      <button class="chip" data-f="In Progress">in progress<b id="n-InProgress"></b></button>
      <button class="chip" data-f="Blocked">blocked<b id="n-Blocked"></b></button>
      <button class="chip" data-f="Done">done<b id="n-Done"></b></button>
    </div>
    <div id="list"></div>
  </div>
  <div id="map"></div>
</div>

<script type="module">
import Map from "https://js.arcgis.com/4.31/@arcgis/core/Map.js";
import MapView from "https://js.arcgis.com/4.31/@arcgis/core/views/MapView.js";
import FeatureLayer from "https://js.arcgis.com/4.31/@arcgis/core/layers/FeatureLayer.js";
import * as geometryEngine from "https://js.arcgis.com/4.31/@arcgis/core/geometry/geometryEngine.js";

/* ================================================================
   ==== SWAP YOUR DATA HERE ====
   Point this at your hosted Feature Service, e.g.:
     const WORKORDER_LAYER_URL = "https://services.arcgis.com/<org>/arcgis/rest/services/workorders/FeatureServer/0";
   …and delete SEED. Required fields: wo_id, title, category, status,
   priority, assignee, due (epoch ms), address.
   ================================================================ */
const WORKORDER_LAYER_URL = null;  // null = demo mode (inline seed)

const SEED = [
  [1,'WO-2401','Streetlight pole #4471 fault','Electrical','Open','High','Chan TM',1760131200,'Kwun Tong Rd / Hoi Yuen Rd',114.2156,22.3105],
  [2,'WO-2402','Blocked gully — flooding risk','Drainage','In Progress','Critical','Wong KK',1760044800,'Ngau Tau Kok MTR Exit B2',114.2198,22.3155],
  [3,'WO-2403','Tree lean >15° after typhoon','Vegetation','Blocked','High','Lam SK',1759875200,'Kowloon Bay Park, Gate 3',114.2080,22.3241],
  [4,'WO-2404','Pothole 0.4m — cycle lane','Roads','Open','Medium','Chan TM',1760217600,'Wai Yip St nr Lai Yip St',114.2117,22.3089],
  [5,'WO-2405','Meter reading anomaly AMR-882','Utilities','Done','Low','Ho CY',1759790000,'Telford Gardens Ph.2',114.2126,22.3185],
  [6,'WO-2406','Guardrail damage — vehicle hit','Roads','In Progress','Medium','Wong KK',1760131200,'Kwun Tong Bypass E-bound',114.2260,22.3090],
  [7,'WO-2407','Illegal dumping — C&D waste','Cleansing','Open','Low','Lam SK',1760304000,'Cha Kwo Ling Rd back alley',114.2320,22.3010],
  [8,'WO-2408','Valve pit water ingress','Utilities','Blocked','Critical','Ho CY',1760044800,'King Yip St / Cheung Yip St',114.2170,22.3060],
  [9,'WO-2409','Repaint zebra crossing','Roads','Done','Low','Chan TM',1759703600,'Shun Yip St junction',114.2130,22.3120],
  [10,'WO-2410','Flood sensor R-14 offline','Drainage','Open','High','Wong KK',1760217600,'Kai Tak nullah sensor pier',114.2035,22.3225],
];
const FIELDS = [
  {name:'OBJECTID',type:'oid'},{name:'wo_id',type:'string'},{name:'title',type:'string'},
  {name:'category',type:'string'},{name:'status',type:'string'},{name:'priority',type:'string'},
  {name:'assignee',type:'string'},{name:'due',type:'date'},{name:'address',type:'string'},
];
/* ==================== end of data block ======================== */

const STATUS_COLOR = { Open:'#fbbf24', 'In Progress':'#38bdf8', Blocked:'#f87171', Done:'#4ade80' };
const PRIO_ICON = { Critical:'exclamation-mark-triangle-f', High:'exclamation-mark-circle-f', Medium:'information', Low:'minus' };

const layer = new FeatureLayer(WORKORDER_LAYER_URL ? { url: WORKORDER_LAYER_URL } : {
  source: SEED.map(r => ({
    attributes:{ OBJECTID:r[0], wo_id:r[1], title:r[2], category:r[3], status:r[4], priority:r[5], assignee:r[6], due:r[7], address:r[8] },
    geometry:{ type:'point', x:r[9], y:r[10], spatialReference:{wkid:4326} },
  })),
  fields: FIELDS, objectIdField:'OBJECTID', geometryType:'point',
  renderer:{
    type:'unique-value', field:'status',
    uniqueValueInfos:Object.entries(STATUS_COLOR).map(([v,c])=>({
      value:v, symbol:{type:'simple-marker',color:c,size:11,outline:{color:'#0d131c',width:1.5}}
    })),
  },
  popupTemplate:{
    title:'{wo_id} — {title}',
    content:[{type:'fields',fieldInfos:[
      {fieldName:'category',label:'Category'},{fieldName:'status',label:'Status'},
      {fieldName:'priority',label:'Priority'},{fieldName:'assignee',label:'Assignee'},
      {fieldName:'due',label:'Due',format:{dateFormat:'short-date'}},{fieldName:'address',label:'Location'},
    ]}],
  },
  outFields:['*'],
});

const view = new MapView({
  container:'map',
  map: new Map({ basemap:'dark-gray-vector', layers:[layer] }),
  center:[114.215, 22.312], zoom:13,
});
// ponytail: Esri widgets are the point of this variant — declare and drop in
view.ui.move('zoom','bottom-right');

/* ---------- job list ---------- */
let filter = 'all', selectedOid = null, graphics = [];
const listEl = document.getElementById('list');
document.getElementById('today').textContent =
  new Date().toLocaleDateString('en-HK',{weekday:'long', day:'numeric', month:'long'}) + ' · LIVE FROM FEATURE LAYER';

function fmtDue(ms){
  const d = new Date(ms), today = new Date(); today.setHours(0,0,0,0);
  const days = Math.round((d - today)/86400000);
  return days < 0 ? `${-days}d overdue` : days === 0 ? 'due today' : `due in ${days}d`;
}

function render(){
  const rows = graphics.filter(g => filter==='all' || g.attributes.status===filter);
  listEl.innerHTML = '';
  rows.forEach(g => {
    const a = g.attributes;
    const card = document.createElement('calcite-card');
    if (a.OBJECTID === selectedOid) card.classList.add('sel');
    card.innerHTML = `
      <div class="job-top">
        <span class="id">${a.wo_id}</span>
        <calcite-chip scale="s" icon="${PRIO_ICON[a.priority]||'minus'}"
          style="color:${STATUS_COLOR[a.status]}">${a.priority}</calcite-chip>
      </div>
      <div class="job-title">${a.title}</div>
      <div class="job-meta">${a.category} · ${a.assignee} · ${fmtDue(a.due)}</div>`;
    card.onclick = () => selectJob(a.OBJECTID);
    listEl.appendChild(card);
  });
  ['Open','InProgress','Blocked','Done'].forEach(k => {
    const n = graphics.filter(g=>g.attributes.status===k.replace(/([A-Z])/g,' $1').trim()).length;
    const el = document.getElementById('n-'+k); if (el) el.textContent = ' '+n;
  });
}

async function selectJob(oid){
  selectedOid = oid;
  const g = graphics.find(x=>x.attributes.OBJECTID===oid);
  if (!g) return;
  render();
  await view.goTo({target:g.geometry, zoom:16}, {duration:500});
  // ponytail: feature.popupTemplate is null on query results; point it at the
  // layer's template — fields won't render without it, and open() no-ops
  g.popupTemplate = layer.popupTemplate;
  view.openPopup({ features:[g], location:g.geometry });
}

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.chip'); if (!btn) return;
  filter = btn.dataset.f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c===btn));
  render();
});

view.whenLayerView(layer).then(async lv => {
  // ponytail: query the layer, not the layerView — client-side FeatureLayer resolves without needing the view to be ready
  const res = await layer.queryFeatures({ outFields:['*'], returnGeometry:true });
  graphics = res.features;
  render();
  // map click → select matching job in list
  view.on('click', async ev => {
    const hit = await view.hitTest(ev, {include: layer});
    if (hit.results.length) selectJob(hit.results[0].graphic.attributes.OBJECTID);
  });
});
</script>
</body>
</html>
