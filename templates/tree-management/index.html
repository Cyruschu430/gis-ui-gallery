<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree Management — GIS UI Gallery</title>

<!--
  ================================================================
  TREE MANAGEMENT — MapLibre template, conversational query UI
  ================================================================
  Single file, no API key. CARTO basemap.

  The chat box uses a LOCAL intent parser (no LLM API call) that maps
  natural language to map actions. Swap the parser for your LLM endpoint
  when you go live — the UI stays the same.

  The Prompt that built this:
  "Build a tree management console: map on the right with tree points
   coloured by health, chat panel on the left that answers queries like
   'show unhealthy trees in Kowloon' or 'trees over 20m', a species
   filter, and a detail panel. MapLibre, single HTML file."
-->

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;510;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0e13; --surface:#11161d; --surface-2:#161d26; --line:rgba(148,196,255,.1);
  --text:#e8f0f8; --text-2:#8fa3b8; --text-3:#4a5568;
  --accent:#4ade80; --accent-soft:rgba(74,222,128,.12); --warn:#fbbf24; --bad:#f87171; --info:#38bdf8;
  --font-sans:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}

#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{background:var(--surface)!important;color:var(--text-3)!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:var(--text-3)!important}

/* left: chat panel */
.chat{position:absolute;left:0;top:0;bottom:0;width:360px;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:2}
.chat header{padding:14px 16px;border-bottom:1px solid var(--line)}
.chat header h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.chat header .sub{font-family:var(--font-mono);font-size:9.5px;color:var(--text-3);letter-spacing:.06em;margin-top:2px}

.chat-log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0}
.msg{max-width:88%;padding:8px 12px;border-radius:10px;font-size:12.5px;line-height:1.45}
.msg.user{align-self:flex-end;background:var(--accent-soft);color:var(--accent);border:1px solid rgba(74,222,128,.2)}
.msg.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);color:var(--text)}
.msg.bot .count{font-family:var(--font-mono);font-weight:600;color:var(--accent)}
.msg.bot .chip-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.msg.bot .chip{font-family:var(--font-mono);font-size:9px;padding:2px 7px;border-radius:99px;background:var(--bg);color:var(--text-2);cursor:pointer;border:1px solid var(--line)}
.msg.bot .chip:hover{color:var(--accent);border-color:var(--accent)}

.chat-input{padding:12px 14px;border-top:1px solid var(--line)}
.chat-input form{display:flex;gap:8px}
.chat-input input{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;
  color:var(--text);font-size:12.5px;outline:none;transition:150ms}
.chat-input input:focus{border-color:var(--accent)}
.chat-input button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:0 14px;cursor:pointer;font-weight:600}
.chat-input button:hover{filter:brightness(1.1)}

/* right: stats strip */
.stats{position:absolute;top:20px;right:20px;display:flex;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.stat b{font-family:var(--font-mono);font-size:16px;font-weight:600;display:block}
.stat.c-good b{color:var(--good)} .stat.c-warn b{color:var(--warn)} .stat.c-bad b{color:var(--bad)}
.stat span{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.09em;color:var(--text-3);text-transform:uppercase}

/* tree detail drawer */
.drawer{position:absolute;right:0;top:0;bottom:0;width:280px;background:var(--surface);border-left:1px solid var(--line);
  padding:16px;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.75,.25,1);z-index:5}
.drawer.show{transform:none}
.drawer h2{font-size:14px;margin-bottom:2px}
.drawer .sub{font-family:var(--font-mono);font-size:10px;color:var(--text-3);margin-bottom:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px}
.kv dt{color:var(--text-3);font-family:var(--font-mono);font-size:10px;align-self:center}
.kv dd{text-align:right;font-family:var(--font-mono);font-size:11px}
.drawer .close{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--text-3);cursor:pointer;font-size:16px}
.drawer .close:hover{color:var(--text)}

/* popup skin */
.maplibregl-popup-content{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;font-family:var(--font-sans);font-size:12px}
.maplibregl-popup-tip{border-top-color:var(--surface)}

@media (max-width:760px){
  .chat{width:100%;height:52%;top:auto;border-right:0;border-top:1px solid var(--line)}
  #map{inset:0 0 52% 0}
  .stats{display:none}
}
</style>
</head>
<body>

<div id="map"></div>

<div class="chat">
  <header>
    <h1>Urban Tree Inventory</h1>
    <div class="sub">KOWLOON DISTRICT · 1,247 TREES · SIMULATED DATA</div>
  </header>
  <div class="chat-log" id="log">
    <div class="msg bot">Ask me about the trees. Try: <span class="count">"show unhealthy trees"</span> or <span class="count">"trees over 20m"</span></div>
  </div>
  <div class="chat-input">
    <form id="chat-form">
      <input id="chat-in" type="text" placeholder="e.g. show unhealthy trees in Mong Kok" autocomplete="off">
      <button type="submit">Ask</button>
    </form>
  </div>
</div>

<div class="stats">
  <div class="stat c-good"><b id="s-total">0</b><span>trees</span></div>
  <div class="stat c-warn"><b id="s-risk">0</b><span>at risk</span></div>
  <div class="stat c-bad"><b id="s-dead">0</b><span>dead</span></div>
</div>

<div class="drawer" id="drawer">
  <button class="close" onclick="closeDrawer()" aria-label="Close">×</button>
  <h2 id="d-name"></h2>
  <div class="sub" id="d-id"></div>
  <dl class="kv">
    <dt>SPECIES</dt><dd id="d-species"></dd>
    <dt>HEIGHT</dt><dd id="d-height"></dd>
    <dt>DBH</dt><dd id="d-dbh"></dd>
    <dt>HEALTH</dt><dd id="d-health"></dd>
    <dt>DISTRICT</dt><dd id="d-district"></dd>
    <dt>LAST INSPECT</dt><dd id="d-inspect"></dd>
  </dl>
</div>

<script>
/* ================================================================
   ==== SWAP YOUR DATA HERE ====
   Replace TREES with your tree inventory API / GeoJSON.
   Expected fields: id, species, height_m, dbh_cm, health (0-100),
   district, lastInspect, lng, lat.
   ================================================================ */
const DISTRICTS = ['Mong Kok','Tsim Sha Tsui','Yau Ma Tei','Kowloon City','Sham Shui Po','Wong Tai Sin','Kwun Tong','Kowloon Bay'];
const SPECIES = ['Bauhinia blakeana','Ficus microcarpa','Delonix regia','Liquidambar formosana','Cinnamomum camphora','Mangifera indica','Plumeria rubra','Bombax ceiba'];
const HEALTH_BANDS = [
  [0,  30,  'Dead',     '#f87171'],
  [30, 60,  'Poor',     '#fbbf24'],
  [60, 85,  'Fair',     '#a3e635'],
  [85, 101, 'Healthy',  '#4ade80'],
];

// deterministic pseudo-random for reproducible demo data
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; } }
const rng = mulberry32(42);

const TREES = [];
for (let i=0; i<1247; i++){
  const d = DISTRICTS[Math.floor(rng()*DISTRICTS.length)];
  // cluster around district centres
  const cx = 114.15 + (DISTRICTS.indexOf(d) % 3) * 0.04 + (rng()-0.5)*0.03;
  const cy = 22.28 + Math.floor(DISTRICTS.indexOf(d) / 3) * 0.025 + (rng()-0.5)*0.02;
  const health = Math.floor(rng()*100);
  TREES.push({
    id: 'T-' + String(10000+i),
    species: SPECIES[Math.floor(rng()*SPECIES.length)],
    height_m: +(3 + rng()*35).toFixed(1),
    dbh_cm: Math.floor(10 + rng()*120),
    health,
    district: d,
    lastInspect: new Date(2026, Math.floor(rng()*9), Math.floor(rng()*28)+1).toISOString().slice(0,10),
    lng: cx, lat: cy,
  });
}
/* ==================== end of data block ======================== */

const HK = [114.17, 22.31];
const map = new maplibregl.Map({
  container:'map',
  style:'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center:HK, zoom:12, pitch:45, bearing:-10, attributionControl:{compact:true},
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-right');

let selectedId = null;
const markers = new Map();

map.on('load', () => {
  map.addSource('trees', { type:'geojson', data:{
    type:'FeatureCollection',
    features: TREES.map(t => ({
      type:'Feature',
      properties:{ id:t.id, species:t.species, height:t.height_m, dbh:t.dbh_cm, health:t.health, district:t.district, inspect:t.lastInspect },
      geometry:{ type:'Point', coordinates:[t.lng, t.lat] },
    })),
  }});
  map.addLayer({ id:'trees', type:'circle', source:'trees',
    paint:{
      'circle-radius': ['interpolate',['linear'],['get','height'], 0, 3, 40, 10],
      'circle-color': [
        'case',
        ['<',['get','health'],30], '#f87171',
        ['<',['get','health'],60], '#fbbf24',
        ['<',['get','health'],85], '#a3e635',
        '#4ade80'
      ],
      'circle-opacity': .85,
      'circle-stroke-color': '#0a0e13',
      'circle-stroke-width': 1,
    }});

  map.on('click','trees', e => {
    const p = e.features[0].properties;
    openTree(p.id);
  });
  map.on('mouseenter','trees', () => map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','trees', () => map.getCanvas().style.cursor='');

  updateStats();
});

/* ---------- chat ---------- */
const log = document.getElementById('log');
const form = document.getElementById('chat-form');
const input = document.getElementById('chat-in');

form.addEventListener('submit', e => {
  e.preventDefault();
  const q = input.value.trim(); if (!q) return;
  addMsg('user', q);
  input.value = '';
  setTimeout(() => handleQuery(q), 300);
});

function addMsg(role, html){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = html;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

/* ---------- local intent parser (no LLM) ---------- */
function handleQuery(q){
  const lower = q.toLowerCase();
  let filtered = TREES;

  // health filter
  if (lower.includes('unhealthy') || lower.includes('poor') || lower.includes('bad') || lower.includes('risk') || lower.includes('critical'))
    filtered = filtered.filter(t => t.health < 60);
  else if (lower.includes('healthy') || lower.includes('good'))
    filtered = filtered.filter(t => t.health >= 85);
  else if (lower.includes('dead') || lower.includes('dying'))
    filtered = filtered.filter(t => t.health < 30);

  // height filter
  const heightMatch = lower.match(/(?:over|above|>|more than)\s*(\d+)\s*m/);
  if (heightMatch) filtered = filtered.filter(t => t.height_m > +heightMatch[1]);
  const heightMatch2 = lower.match(/(\d+)\s*m/);
  if (!heightMatch && heightMatch2) filtered = filtered.filter(t => t.height_m > +heightMatch2[1]);

  // district filter
  const district = DISTRICTS.find(d => lower.includes(d.toLowerCase()));
  if (district) filtered = filtered.filter(t => t.district === district);

  // species filter
  const species = SPECIES.find(s => lower.includes(s.split(' ')[0].toLowerCase()));
  if (species) filtered = filtered.filter(t => t.species === species);

  // "how many"
  if (lower.includes('how many') || lower.includes('count') || lower.includes('number'))
    return respondCount(filtered, q);

  // "show" / "find" / "where"
  respondFilter(filtered, q, district);
}

function respondCount(trees, q){
  const n = trees.length;
  const byDistrict = {};
  trees.forEach(t => { byDistrict[t.district] = (byDistrict[t.district]||0)+1; });
  const top = Object.entries(byDistrict).sort((a,b)=>b[1]-a[1]).slice(0,3);
  addMsg('bot', `Found <span class="count">${n.toLocaleString()}</span> trees. Top districts: ${top.map(([d,n])=>`${d} (${n})`).join(', ')}`);
}

function respondFilter(trees, q, district){
  const n = trees.length;
  if (!n){ addMsg('bot','No trees match. Try a broader query.'); return; }
  addMsg('bot', `Showing <span class="count">${n.toLocaleString()}</span> trees${district ? ' in ' + district : ''}. ${n > 50 ? 'Click a point for details.' : 'Click any marker for details.'}`);
  // highlight on map
  const ids = new Set(trees.map(t=>t.id));
  map.setFilter('trees', ['in',['get','id'],['literal',[...ids]]]);
  map.easeTo({center: district ? [114.15 + (DISTRICTS.indexOf(district)%3)*0.04, 22.28 + Math.floor(DISTRICTS.indexOf(district)/3)*0.025] : HK, zoom: district ? 14 : 12, duration:800});
  // quick-pick chips
  const chipRow = document.createElement('div');
  chipRow.className = 'chip-row';
  trees.slice(0,5).forEach(t => {
    const c = document.createElement('span');
    c.className = 'chip'; c.textContent = t.id;
    c.onclick = () => openTree(t.id);
    chipRow.appendChild(c);
  });
  if (n > 5) { const c = document.createElement('span'); c.className = 'chip'; c.textContent = `+${n-5} more`; chipRow.appendChild(c); }
  log.lastChild.appendChild(chipRow);
}

/* ---------- detail ---------- */
function openTree(id){
  const t = TREES.find(x=>x.id===id); if (!t) return;
  selectedId = id;
  document.getElementById('d-name').textContent = t.species;
  document.getElementById('d-id').textContent = t.id + ' · ' + t.district;
  document.getElementById('d-species').textContent = t.species;
  document.getElementById('d-height').textContent = t.height_m + ' m';
  document.getElementById('d-dbh').textContent = t.dbh_cm + ' cm';
  document.getElementById('d-health').textContent = t.health + '/100 (' + HEALTH_BANDS.find(b=>t.health>=b[0]&&t.health<b[1])[2] + ')';
  document.getElementById('d-district').textContent = t.district;
  document.getElementById('d-inspect').textContent = t.lastInspect;
  document.getElementById('drawer').classList.add('show');
  map.easeTo({center:[t.lng,t.lat], zoom:16, duration:600});
}
function closeDrawer(){ document.getElementById('drawer').classList.remove('show'); selectedId=null; }

/* ---------- stats ---------- */
function updateStats(){
  document.getElementById('s-total').textContent = TREES.length.toLocaleString();
  document.getElementById('s-risk').textContent = TREES.filter(t=>t.health>=30&&t.health<60).length.toLocaleString();
  document.getElementById('s-dead').textContent = TREES.filter(t=>t.health<30).length.toLocaleString();
}

/* ---------- reset on empty query ---------- */
input.addEventListener('input', () => {
  if (!input.value.trim()) { map.setFilter('trees', null); updateStats(); }
});
</script>
</body>
</html>
